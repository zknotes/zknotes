<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="ZKnotes Icon"><title>ZKnotes Icon</title>
  <defs>

    <linearGradient id="meshGrad" x1="256" y1="56" x2="256" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"></stop>
      <stop offset="52%" stop-color="#2dd4bf"></stop>
      <stop offset="100%" stop-color="#22d3ee"></stop>
    </linearGradient>

    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <filter id="nodeGlow" x="-160%" y="-160%" width="420%" height="420%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <filter id="apexGlow" x="-250%" y="-250%" width="600%" height="600%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

  </defs>

  <!-- outer octagon — the recognizable silhouette at small sizes -->
  <g stroke="url(#meshGrad)" stroke-linecap="round" fill="none" filter="url(#lineGlow)">

    <line x1="256" y1=" 56" x2=" 96" y2="160" stroke-width="7"></line>
    <line x1="256" y1=" 56" x2="416" y2="160" stroke-width="7"></line>
    <line x1=" 96" y1="160" x2=" 60" y2="292" stroke-width="7"></line>
    <line x1="416" y1="160" x2="452" y2="292" stroke-width="7"></line>
    <line x1=" 60" y1="292" x2="130" y2="412" stroke-width="7"></line>
    <line x1="452" y1="292" x2="382" y2="412" stroke-width="7"></line>
    <line x1="130" y1="412" x2="256" y2="454" stroke-width="7"></line>
    <line x1="382" y1="412" x2="256" y2="454" stroke-width="7"></line>

    <!-- spokes toward the center — kept thick+few so they still read at 20px -->
    <line x1="256" y1=" 56" x2="256" y2="256" stroke-width="5.5" opacity="0.85"></line>
    <line x1=" 96" y1="160" x2="256" y2="256" stroke-width="5.5" opacity="0.85"></line>
    <line x1="416" y1="160" x2="256" y2="256" stroke-width="5.5" opacity="0.85"></line>
    <line x1=" 60" y1="292" x2="256" y2="256" stroke-width="5.5" opacity="0.7"></line>
    <line x1="452" y1="292" x2="256" y2="256" stroke-width="5.5" opacity="0.7"></line>
    <line x1="256" y1="454" x2="256" y2="256" stroke-width="5.5" opacity="0.85"></line>

  </g>

  <g filter="url(#nodeGlow)">
    <circle cx=" 96" cy="160" r="11" fill="#34d399"></circle>
    <circle cx="416" cy="160" r="11" fill="#34d399"></circle>
    <circle cx=" 60" cy="292" r="10.5" fill="#2dd4bf"></circle>
    <circle cx="452" cy="292" r="10.5" fill="#2dd4bf"></circle>
    <circle cx="130" cy="412" r="10.5" fill="#22d3ee"></circle>
    <circle cx="382" cy="412" r="10.5" fill="#22d3ee"></circle>
    <circle cx="256" cy="454" r="11" fill="#22d3ee"></circle>
  </g>

  <circle cx=" 96" cy="160" r="4.5" fill="white" opacity="0.6"></circle>
  <circle cx="416" cy="160" r="4.5" fill="white" opacity="0.6"></circle>
  <circle cx=" 60" cy="292" r="4.2" fill="white" opacity="0.55"></circle>
  <circle cx="452" cy="292" r="4.2" fill="white" opacity="0.55"></circle>
  <circle cx="130" cy="412" r="4.2" fill="white" opacity="0.5"></circle>
  <circle cx="382" cy="412" r="4.2" fill="white" opacity="0.5"></circle>
  <circle cx="256" cy="454" r="4.5" fill="white" opacity="0.5"></circle>

  <circle cx="256" cy="56" r="16" fill="#34d399" filter="url(#apexGlow)"></circle>
  <circle cx="256" cy="56" r="9" fill="#86efac"></circle>
  <circle cx="256" cy="56" r="4.5" fill="white" opacity="0.9"></circle>

</svg>
