    <line x1="130" y1="412" x2="256" y2="360" stroke-width="3.5" opacity="0.9"/>
    <line x1="382" y1="412" x2="256" y2="360" stroke-width="3.5" opacity="0.9"/>
    <line x1="256" y1="454" x2="256" y2="360" stroke-width="3.5" opacity="0.9"/>
    <line x1="176" y1="216" x2="336" y2="216" stroke-width="3.0" opacity="0.82"/>
    <line x1="176" y1="216" x2="256" y2="252" stroke-width="3.0" opacity="0.82"/>
    <line x1="336" y1="216" x2="256" y2="252" stroke-width="3.0" opacity="0.82"/>
    <line x1="176" y1="216" x2="256" y2="360" stroke-width="3.0" opacity="0.78"/>
