    <line x1=" 60" y1="292" x2="130" y2="412" stroke-width="4.5"/>
    <line x1="452" y1="292" x2="382" y2="412" stroke-width="4.5"/>
    <line x1="130" y1="412" x2="256" y2="454" stroke-width="4.5"/>
    <line x1="382" y1="412" x2="256" y2="454" stroke-width="4.5"/>
    <line x1="256" y1=" 56" x2="256" y2="252" stroke-width="3.5" opacity="0.9"/>
    <line x1=" 96" y1="160" x2="176" y2="216" stroke-width="3.5" opacity="0.9"/>
    <line x1="416" y1="160" x2="336" y2="216" stroke-width="3.5" opacity="0.9"/>
