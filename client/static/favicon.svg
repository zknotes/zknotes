    <circle cx="416" cy="160" r="9.5" fill="#34d399"/>
    <circle cx=" 60" cy="292" r="9" fill="#2dd4bf"/>
    <circle cx="452" cy="292" r="9" fill="#2dd4bf"/>
    <circle cx="130" cy="412" r="9" fill="#22d3ee"/>
    <circle cx="382" cy="412" r="9" fill="#22d3ee"/>
    <circle cx="256" cy="454" r="9.5" fill="#22d3ee"/>
  </g>
  <circle cx=" 96" cy="160" r="4" fill="white" opacity="0.55"/>
  <circle cx="416" cy="160" r="4" fill="white" opacity="0.55"/>
  <circle cx=" 60" cy="292" r="3.8" fill="white" opacity="0.50"/>
  <circle cx="452" cy="292" r="3.8" fill="white" opacity="0.50"/>
  <circle cx="130" cy="412" r="3.8" fill="white" opacity="0.45"/>
  <circle cx="382" cy="412" r="3.8" fill="white" opacity="0.45"/>
  <circle cx="256" cy="454" r="4" fill="white" opacity="0.45"/>
  <g filter="url(#innerGlow)">
    <circle cx="176" cy="216" r="7.5" fill="#34d399"/>
    <circle cx="336" cy="216" r="7.5" fill="#34d399"/>
    <circle cx="256" cy="252" r="7" fill="#2dd4bf"/>
    <circle cx="256" cy="360" r="8" fill="#22d3ee"/>
  </g>
  <circle cx="176" cy="216" r="3" fill="white" opacity="0.45"/>
  <circle cx="336" cy="216" r="3" fill="white" opacity="0.45"/>
  <circle cx="256" cy="252" r="2.8" fill="white" opacity="0.40"/>
  <circle cx="256" cy="360" r="3.2" fill="white" opacity="0.40"/>
  <circle cx="256" cy="56" r="14" fill="#34d399" filter="url(#apexGlow)"/>
  <circle cx="256" cy="56" r="8" fill="#86efac"/>
